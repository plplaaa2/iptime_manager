# Summary: Port rule actions and optional fields for partial updates.
# Related files: services.py, port_forward.py, translations/*.json.
get_port_forward_rules:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: iptime_manager
add_port_forward_rule:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: iptime_manager
    name:
      required: true
      selector:
        text:
    active:
      selector:
        boolean:
    protocol:
      selector:
        select:
          options:
            - label: TCP
              value: tcp
            - label: UDP
              value: udp
            - label: TCP+UDP
              value: tcpudp
    internal_ip:
      selector:
        text:
    external_port_start:
      selector:
        number:
          min: 1
          max: 65535
          step: 1
          mode: box
    external_port_end:
      selector:
        number:
          min: 1
          max: 65535
          step: 1
          mode: box
    internal_port_start:
      selector:
        number:
          min: 1
          max: 65535
          step: 1
          mode: box
    internal_port_end:
      selector:
        number:
          min: 1
          max: 65535
          step: 1
          mode: box
update_port_forward_rule:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: iptime_manager
    name:
      required: true
      selector:
        text:
    active:
      selector:
        boolean:
    protocol:
      selector:
        select:
          options:
            - label: TCP
              value: tcp
            - label: UDP
              value: udp
            - label: TCP+UDP
              value: tcpudp
    internal_ip:
      selector:
        text:
    external_port_start:
      selector:
        number:
          min: 1
          max: 65535
          step: 1
          mode: box
    external_port_end:
      selector:
        number:
          min: 1
          max: 65535
          step: 1
          mode: box
    internal_port_start:
      selector:
        number:
          min: 1
          max: 65535
          step: 1
          mode: box
    internal_port_end:
      selector:
        number:
          min: 1
          max: 65535
          step: 1
          mode: box
    new_name:
      selector:
        text:
delete_port_forward_rule:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: iptime_manager
    name:
      required: true
      selector:
        text:
